<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESR UN/Halloween/Cartoon Character Costume Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Forest Green to Deep Emerald Gradient */
      background: linear-gradient(135deg, #0d3b1e 0%, #1a5e34 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      /* Gold Top Border & Soft Shadow */
      border-top: 6px solid #d4af37;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 500px;
    }
    h2 { 
      color: #0d3b1e; 
      text-align: center; 
      margin-top: 0; 
      margin-bottom: 8px;
      font-size: 20px;
      line-height: 1.3;
    }
    .subtitle {
      text-align: center; 
      color: #d4af37; 
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    label { 
      font-weight: 600; 
      margin-top: 15px; 
      display: block; 
      color: #1a5e34; 
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #c8d6ca;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fcfdfc;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 25px;
      /* Gold Button Background */
      background-color: #d4af37;
      color: #0d3b1e;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover { 
      background-color: #c29d2b; 
    }
    button:active {
      transform: scale(0.99);
    }
    #statusMessage { 
      margin-top: 20px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 14px;
    }
    .success { color: #1a5e34; }
    .error { color: #b71c1c; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ESR UN/Halloween/Cartoon Character Costume Registration</h2>
    <div class="subtitle">Official Registration</div>
    
    <form id="registrationForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required placeholder="e.g. Juan Cruz">

      <label for="gradeLevel">Grade Level</label>
      <select id="gradeLevel" required>
        <option value="">Select Grade Level</option>
        <option value="Grade 7">Grade 7</option>
        <option value="Grade 8">Grade 8</option>
        <option value="Grade 9">Grade 9</option>
        <option value="Grade 10">Grade 10</option>
        <option value="Grade 11">Grade 11</option>
        <option value="Grade 12">Grade 12</option>
      </select>

      <label for="costumeCategory">Costume Category</label>
      <select id="costumeCategory" required>
        <option value="">Select Category</option>
        <option value="UN Costume">UN Costume</option>
        <option value="Halloween Costume">Halloween Costume</option>
        <option value="Cartoon Character">Cartoon Character</option>
      </select>

      <label for="contactNumber">Contact Number</label>
      <input type="tel" id="contactNumber" required pattern="[0-9]{11}" placeholder="09123456789">

      <button type="submit" id="submitBtn">Register Now</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    // Local storage check for single submission per device/browser
    if (localStorage.getItem("esr_parade_registered")) {
      document.getElementById("registrationForm").style.display = "none";
      document.getElementById("statusMessage").innerHTML = "<p class='error'>You have already registered on this device.</p>";
    }

    const scriptURL = 'https://script.google.com/macros/s/AKfycbyPUM8l2xAlRq91NW-ZVdMQsVzAAW7odSc84ShJx_hGqK0WDYtBBHIKzSK336Q992rIHA/exec';
    const form = document.getElementById('registrationForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusMessage.innerText = "";

      const payload = {
        fullName: document.getElementById('fullName').value,
        gradeLevel: document.getElementById('gradeLevel').value,
        costumeCategory: document.getElementById('costumeCategory').value,
        contactNumber: document.getElementById('contactNumber').value
      };

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if (data.result === "success") {
          localStorage.setItem("esr_parade_registered", "true");
          form.reset();
          form.style.display = "none";
          statusMessage.className = "success";
          statusMessage.innerText = data.message;
        } else {
          statusMessage.className = "error";
          statusMessage.innerText = data.message;
          submitBtn.disabled = false;
          submitBtn.innerText = "Register Now";
        }
      })
      .catch(error => {
        statusMessage.className = "error";
        statusMessage.innerText = "Something went wrong. Please try again.";
        submitBtn.disabled = false;
        submitBtn.innerText = "Register Now";
      });
    });
  </script>
</body>
</html>
